name: Unity Tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
      - unity-6.6
  pull_request:
    branches:
      - master
      - develop
      - unity-6.6

permissions:
  checks: write
  contents: read

jobs:
  testEditMode:
    name: Test EditMode
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (GitHub Actions)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
    
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: parley

      - name: Run Unity Tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.8f1
          projectPath: parley
          packageMode: true
          testMode: editmode
          customParameters: -buildTarget StandaloneLinux64

      - name: Assert tests actually ran
        if: always()
        shell: bash
        run: |
          file=$(find artifacts -name '*-results.xml' | head -n 1)
          if [ -z "$file" ]; then
            echo "No test results XML produced"
            exit 1
          fi
          total=$(grep -o 'total="[0-9]*"' "$file" | head -n 1 | grep -o '[0-9]*')
          echo "results=$file total=${total:-0}"
          if [ "${total:-0}" -lt 1 ]; then
            echo "0 tests ran -> gate excluded the test assembly"
            exit 1
          fi
